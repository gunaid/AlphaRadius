# ALPHA_REALM_POLICY_V1
# Hotspot "domain" choices: card@512k/2M|yes (speed in RouterOS rx/tx order,
# "yes" = block updates). The domain arrives in User-Name (split-user-domain=no)
# or as Mikrotik-Realm. fn_realm_policy() validates it (database/
# realm_policy_schema.py); only a valid domain is stripped, so accounting and
# every query use the bare card name and other '@' usernames are untouched.
# Runs before filter_username, which would reject a realm without a dot.
# Result for post-auth: control:Tmp-String-6 = "<rate>;<address-list>".

alpha_realm_extract {
    if (&User-Name && (&User-Name =~ /^([^@]+)@([^@]+)$/)) {
        update control {
            &Tmp-String-7 := "%{1}"
            &Tmp-String-8 := "%{2}"
        }
        update control {
            &Tmp-String-6 := "%{sql:SELECT fn_realm_policy('%{control:Tmp-String-8}')}"
        }
        if (&control:Tmp-String-6 && (&control:Tmp-String-6 != "")) {
            update request {
                &User-Name := "%{control:Tmp-String-7}"
            }
        }
    }
    elsif (&Mikrotik-Realm && (&Mikrotik-Realm != "")) {
        update control {
            &Tmp-String-8 := "%{Mikrotik-Realm}"
        }
        update control {
            &Tmp-String-6 := "%{sql:SELECT fn_realm_policy('%{control:Tmp-String-8}')}"
        }
    }
}

# Accounting: the same User-Name rewrite only, before acct_unique.
alpha_realm_username {
    if (&User-Name && (&User-Name =~ /^([^@]+)@([^@]+)$/)) {
        update control {
            &Tmp-String-7 := "%{1}"
            &Tmp-String-8 := "%{2}"
        }
        update control {
            &Tmp-String-6 := "%{sql:SELECT fn_realm_policy('%{control:Tmp-String-8}')}"
        }
        if (&control:Tmp-String-6 && (&control:Tmp-String-6 != "")) {
            update request {
                &User-Name := "%{control:Tmp-String-7}"
            }
        }
    }
}
