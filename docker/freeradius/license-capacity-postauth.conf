    # Optional allow-list is independent of password, license and session limits.
    # Missing/failed SQL is never permission to bypass an enabled restriction.
    update control {
        Tmp-String-4 := "%{sql:SELECT fn_account_mac_allowed('%{User-Name}', '%{Calling-Station-Id}')}"
    }
    if (&control:Tmp-String-4 != "1") {
        update reply {
            Reply-Message := "%{%{sql:SELECT fn_rmsg('mac')}:-MAC address is not allowed for this account}"
        }
        reject
    }
    # ALPHA_LICENSE_ATOMIC_CAPACITY
    update control {
        Tmp-String-0 := "%{md5:%{Packet-Src-IP-Address}|%{NAS-IP-Address}|%{User-Name}|%{Calling-Station-Id}|%{NAS-Port}|%{Packet-Authentication-Vector}}"
        Tmp-String-1 := "%{sql:SELECT fn_reserve_license_slot('%{control:Tmp-String-0}', '%{User-Name}', '%{NAS-IP-Address}', '%{Calling-Station-Id}', '%{NAS-Port}', '%{Packet-Src-IP-Address}')}"
    }
    if (&control:Tmp-String-1 != "1") {
        if (&control:Tmp-String-1 == "0") {
            update reply {
                Reply-Message := "%{%{sql:SELECT fn_rmsg('capacity')}:-Concurrent session capacity reached}"
            }
        }
        elsif (&control:Tmp-String-1 == "3") {
            update reply {
                Reply-Message := "%{%{sql:SELECT fn_rmsg('mac')}:-MAC address is not allowed for this account}"
            }
        }
        elsif (&control:Tmp-String-1 == "2") {
            update reply {
                Reply-Message := "%{%{sql:SELECT fn_rmsg('simultaneous')}:-simultaneous session limit reached}"
            }
        }
        else {
            update reply {
                Reply-Message := "%{%{sql:SELECT fn_rmsg('license')}:-License verification unavailable or license invalid}"
            }
        }
        reject
    }
    if (User-Name != "healthcheck") {
        update reply {
            Class += "maxcap:%{control:Tmp-String-0}"
        }
    }

    # Freeze only after authentication and capacity acceptance; refresh the first
    # response from the atomic snapshot before sending it to the NAS.
    update control {
        Tmp-String-2 := "%{sql:SELECT fn_freeze_voucher_policy('%{User-Name}')}"
    }
    if (&control:Tmp-String-2 != "1" && &control:Tmp-String-2 != "2" && &control:Tmp-String-2 != "3") {
        reject
    }
    # Only the first accepted policy needs the expensive quota reply refresh.
    if (&control:Tmp-String-2 == "3") {
        update reply {
            Mikrotik-Rate-Limit !* ANY
            Mikrotik-Total-Limit !* ANY
            Mikrotik-Total-Limit-Gigawords !* ANY
            Session-Timeout !* ANY
        }
        sql.authorize
        if (fail || invalid || reject || notfound) {
            reject
        }
    }
    if (&control:Tmp-String-2 == "2" || &control:Tmp-String-2 == "3") {
        update control {
            Tmp-String-3 := "%{sql:SELECT COALESCE(snap_rate_limit_str,'0/0') FROM wisp_vouchers WHERE username='%{User-Name}' AND policy_frozen_at IS NOT NULL}"
        }
        if (&control:Tmp-String-3 == "") {
            reject
        }
        update reply {
            Mikrotik-Rate-Limit := "%{control:Tmp-String-3}"
        }
        if (&reply:Mikrotik-Rate-Limit == "0/0") {
            update reply {
                Mikrotik-Rate-Limit !* ANY
            }
        }
    }

    # Hotspot domain choices (alpha-realm-policy.conf): the chosen speed only
    # when the package has none (a package speed always wins), and the
    # update-block address list. The choice is recorded for the panel.
    if (&control:Tmp-String-6 && (&control:Tmp-String-6 =~ /^([^;]*);(.*)$/)) {
        update control {
            &Tmp-String-7 := "%{1}"
            &Tmp-String-9 := "%{2}"
        }
        if ((&control:Tmp-String-7 != "") && (!&reply:Mikrotik-Rate-Limit || (&reply:Mikrotik-Rate-Limit == "0/0"))) {
            update reply {
                Mikrotik-Rate-Limit := "%{control:Tmp-String-7}"
            }
        }
        if ((&control:Tmp-String-9 != "") && !&reply:Mikrotik-Address-List) {
            update reply {
                Mikrotik-Address-List := "%{control:Tmp-String-9}"
            }
        }
        update control {
            &Tmp-String-9 := "%{sql:SELECT fn_record_realm_choice('%{User-Name}', '%{NAS-IP-Address}', '%{Calling-Station-Id}', '%{control:Tmp-String-8}', '%{control:Tmp-String-6}')}"
        }
    }

    # Cloned MACs (one MAC on many phones): keep the package's hotspot profile
    # but use its copy without MAC cookie, only if that copy is confirmed on
    # this router. Hotspot only; PPP profiles are untouched. Empty = unchanged.
    if (!&Framed-Protocol || (&Framed-Protocol != "PPP")) {
        update control {
            Tmp-String-5 := "%{sql:SELECT fn_cloned_mac_profile('%{Calling-Station-Id}', '%{NAS-IP-Address}', '%{reply:Mikrotik-Group}')}"
        }
        if (&control:Tmp-String-5 && &control:Tmp-String-5 != "") {
            update reply {
                Mikrotik-Group := "%{control:Tmp-String-5}"
            }
        }
    }
